<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B58">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Meu Caixa</title>
<link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="gate" hidden></div>
<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="brand">Meu Caixa <span class="sv" id="status" role="status"></span></div>
      <div class="month" role="group" aria-label="Mês em análise">
        <button type="button" data-action="prev" aria-label="Mês anterior">‹</button>
        <span class="lbl num" id="mlabel"></span>
        <button type="button" data-action="next" aria-label="Próximo mês">›</button>
      </div>
      <button type="button" class="btn ghost" data-action="today">Hoje</button>
      <button type="button" class="btn primary" data-action="new-exp">+ Lançamento</button>
    </div>
    <nav class="tabs" aria-label="Seções" id="tabs">
      <a href="#painel" data-tab="painel">Painel</a>
      <a href="#mes" data-tab="mes">Mês</a>
      <a href="#cartoes" data-tab="cartoes">Cartões</a>
      <a href="#parcelas" data-tab="parcelas">Parcelas</a>
      <a href="#pessoas" data-tab="pessoas">Pessoas</a>
      <a href="#fixos" data-tab="fixos">Fixos e renda</a>
      <a href="#projetos" data-tab="projetos">Projetos</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<button type="button" class="fab" data-action="quick" aria-label="Gasto rápido" title="Gasto rápido">+</button>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script src="supabase-config.js"></script>
<script src="vendor-supabase.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
